  <style>
    /* A favicon is loaded as its own document and cannot see the page's theme, so the letterform
       switches on the OS preference — the only signal that reaches here. Without this it renders
       black, which is invisible in every dark browser chrome. */
    .glyph { fill: #12151A; }
    @media (prefers-color-scheme: dark) {
      .glyph { fill: #E6E9EE; }
    }
