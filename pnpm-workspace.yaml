# The @cloudbitmaps family monorepo — six packages, five of them on two axes, all versioned and released in lockstep.
#
#   packages/core        → @cloudbitmaps/core        the codec-agnostic engine, the .crbm format, the driver
#                                                    PORTS, and the in-memory + local-filesystem drivers.
#                                                    No cloud SDK anywhere in it. Publishes
#                                                    `@cloudbitmaps/core/driver-kit`, the contract a driver
#                                                    package builds against.
#   packages/roaring     → @cloudbitmaps/roaring     the CODEC axis: the roaring codec + CloudRoaring facade
#   packages/s3          → @cloudbitmaps/s3          the STORAGE axis: one package per storage service, each
#   packages/gcs         → @cloudbitmaps/gcs         with its cloud SDK as a real dependency, not a peer.
#   packages/azure-blob  → @cloudbitmaps/azure-blob  Users install one package of each axis.
#   packages/tools       → @cloudbitmaps/tools       offline tools that need nothing internal from a store:
#                                                    the cost model. On neither axis; it takes core's public
#                                                    entry and nothing else.
#
# Every dependent depends on `@cloudbitmaps/core` via `workspace:^`, which pnpm resolves to a symlink into
# `packages/core` locally and rewrites to a real semver range at publish. The dependency arrow is one-way —
# core never imports a flavor or a driver package (that would be a cycle), which `pnpm lint:arch` proves.
packages:
  - 'packages/*'

# Settings pnpm reads from this file (pnpm 11 and later no longer read the `pnpm` field of package.json).
#
# Forced transitive versions: each pins a patched release inside its current major (see SECURITY.md).
overrides:
  undici: '>=6.28.0 <7'
  brace-expansion@5: '>=5.0.12 <6'
  nanoid@3: '>=3.3.18 <4'
  uuid: ^11.1.1
  esbuild: '>=0.28.2 <0.29'
  source-map-js: '>=1.2.2 <2'
  shell-quote: '>=1.11.0 <2'

# Dependencies whose install scripts may run (pnpm runs none unless allowed). `roaring` compiles the native
# CRoaring addon. `esbuild`'s script only swaps its launcher for the platform binary, which it ships as an
# optional dependency anyway, so it stays off.
allowBuilds:
  roaring: true
  esbuild: false

# Triaged advisories `scripts/audit.cjs` skips (rationale in SECURITY.md).
auditConfig:
  ignoreGhsas: []
