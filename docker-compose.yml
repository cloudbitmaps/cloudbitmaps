# Pinned so every git worktree shares ONE set of emulators. Compose otherwise derives the project name
# from the directory, so a second worktree gets its own project — `down -v` there wipes nothing, while
# the first project's containers keep the ports and their data. The tests then read a dirty store and
# fail with `generation already exists (write-once)`, which reads exactly like a real regression.
name: cloud-roaring

# Local integration backends — no real AWS needed.
# Usage: `docker compose up -d` then `pnpm test:integration`.
#
# REGISTRIES: everything that can avoid Docker Hub does. GitHub-hosted runners share an IP pool that sits
# permanently over Docker Hub's anonymous pull limit, so pulling nine images from there failed the integration
# job with HTTP 429 on every run. `public.ecr.aws/docker/library/*` is AWS's official mirror of the same Docker
# Official Images (same content, no auth, no rate limit); azurite comes from mcr, first-party, and MinIO from
# Chainguard's build of it (below). `fake-gcs-server` is the lone exception — it has no non-Docker-Hub home — and one anonymous pull
# is a far smaller target than a whole compose file's worth. If Docker Hub 429s return, that image is the one to deal with, either by
# authenticating or by mirroring it; do not "tidy" the others back to bare Docker Hub names.
services:
  minio:
    # PINNED (not `:latest`), like fake-gcs and azurite below and for the same reason: every run otherwise
    # pulls whatever MinIO shipped that morning, and the write-once semantics this suite asserts are exactly
    # what a MinIO release could change — producing a red integration job with nothing in our diff to point
    # at. Bump deliberately, and re-run `pnpm test:integration` when you do.
    #
    # FROM CHAINGUARD, because MinIO's own image can no longer be pulled without a login: quay.io/minio/minio
    # began answering `unauthorized` to anonymous pulls in late September 2026 (this job passed on 2026-09-23 and
    # failed on every run from 2026-09-25), and the tag pinned here was never on Docker Hub. cgr.dev/chainguard/minio is MinIO itself, built from source by Chainguard, and pulls without a
    # login. Its free tier serves only `latest`, so this pins the multi-arch index DIGEST that `latest` was on
    # 2026-09-25 (MinIO RELEASE.2026-09-22T19-25-18Z). If a pull by this digest ever fails, re-pin to the
    # current `latest` digest and re-run the integration suite; do not switch to `:latest` itself.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: cloud-roaring-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    # `docker compose up --wait` treats a service with no healthcheck as ready the moment it is RUNNING,
    # which for an object store is tens of milliseconds before it accepts a connection. ci.yml already
    # justifies its `--wait-timeout` as protection against "a backend that never goes healthy" — a condition
    # that could not arise while nothing defined health. These make that true.
    #
    # The image has bash but no curl, so bash's /dev/tcp asks the liveness endpoint the same question curl did:
    # does GET /minio/health/live answer 200. `$$` is compose's escape for a literal `$`.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Google Cloud Storage emulator for the GcsStorageDriver integration lane. The client reaches it by
  # passing `apiEndpoint: http://127.0.0.1:4443` (see tests/integration/gcs.test.ts) — no real GCP, no auth.
  # `-external-url` must match that host so resumable-upload session URLs point back at the emulator.
  # PINNED (not `:latest`): 1.52.2 is verified to enforce `ifGenerationMatch: 0` on the simple (non-resumable)
  # upload path the driver uses for small objects — the write-once assertion depends on it. Bump deliberately.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: cloud-roaring-fake-gcs
    ports:
      - '4443:4443'
    command:
      - '-scheme'
      - 'http'
      - '-port'
      - '4443'
      - '-public-host'
      - '127.0.0.1:4443'
      - '-external-url'
      - 'http://127.0.0.1:4443'
      - '-backend'
      - 'memory'

    # Azure Blob Storage emulator (Azurite) for the AzureBlobStorageDriver integration lane. The client
    # reaches it via the well-known dev connection string (see tests/integration/azure.test.ts) — no real Azure,
    # no auth. PINNED (not `:latest`): 3.35.0 is a known-good build; `--skipApiVersionCheck` lets a newer SDK
    # `x-ms-version` through (the SDK ships a more recent API version than a pinned Azurite recognizes).
    # Write-once (`ifNoneMatch: '*'`) is enforced by Azurite on BOTH upload paths the driver uses (empirically
    # verified — 409 BlobAlreadyExists); that assertion depends on it. Bump deliberately.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:4443/storage/v1/b']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: cloud-roaring-azurite
    ports:
      - '10000:10000'
    command:
      - 'azurite-blob'
      - '--blobHost'
      - '0.0.0.0'
      - '--blobPort'
      - '10000'
      - '--skipApiVersionCheck'
      # Memory-only, like fake-gcs's `-backend memory`: state is dropped on restart so a reused container never
      # accumulates blobs across runs and collides on the write-once `conf/N` keys (the suite assumes a fresh emulator).
      - '--inMemoryPersistence'
    healthcheck:
      # A TCP connect, not an HTTP probe: Azurite answers 400/403 to every UNAUTHENTICATED request, so no
      # URL returns 200 and an HTTP healthcheck would never pass. Accepting a connection is exactly the
      # property that was missing anyway — the failure this guards against is ECONNREFUSED on a cold start.
      test: ['CMD', 'nc', '-z', '127.0.0.1', '10000']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
