<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="The monthly bill as the data grows, on log scales: the Redis that holds the data climbs in steps from $35.04 a month at 100 MB to $268,531 at 20 TB, while CloudBitmaps at one cold intersect a second goes from $214 to $643. They cross near 2.5 GB.">
