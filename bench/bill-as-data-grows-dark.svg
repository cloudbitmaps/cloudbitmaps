<text x="28" y="58" font-size="12.5" fill="#9198a1">aws-us-east-1-ondemand · Redis: the cheapest on-demand Redis OSS cluster that holds the data</text>
<text x="28" y="75" font-size="12.5" fill="#9198a1">CloudBitmaps: one cold intersect a second, of two 2,000-chunk segments sharing 100</text>
