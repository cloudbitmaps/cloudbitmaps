name: Restore the images a job runs
description: >-
  Restores from the Actions cache the images an earlier run of this job pulled, and points scripts/lib/docker-pull.sh at
  them, so a registry that refuses or throttles a pull fails the job only when no copy is kept. Keyed by the month, so a
  tag is pulled again once a month, and by the files that name the images, so a re-pinned image is pulled at once. Pair
  it with docker-images-save, run with `if: always()`.
inputs:
  name:
    description: A name for this job's images, unique among the jobs that keep some.
    required: true
  files:
    description: The file that names the images, as hashFiles() takes it.
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "key=docker-images-${{ inputs.name }}-$(date -u +%Y-%m)-${{ hashFiles(inputs.files) }}" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/docker-images
        key: ${{ steps.key.outputs.key }}
        restore-keys: docker-images-${{ inputs.name }}-
    - shell: bash
      run: |
        {
          echo "DOCKER_IMAGE_CACHE=$RUNNER_TEMP/docker-images"
          echo "DOCKER_IMAGE_CACHE_HIT=${{ steps.restore.outputs.cache-hit }}"
          echo "DOCKER_IMAGE_CACHE_KEY=${{ steps.key.outputs.key }}"
        } >> "$GITHUB_ENV"
