name: Fuzz (nightly + weekly deep)

# Coverage-guided fuzzing of the untrusted-bytes boundary.
# Runs NIGHTLY (10 min/target) AND a WEEKLY DEEP soak (60 min/target) — plus on demand — NOT on every PR:
# fuzzing is a time-budgeted campaign, not a pass/fail gate. The corpus is cached + accretive across runs, so the
# untrusted-input surface is exercised far beyond any single nightly budget. A fully-continuous
# OSS-Fuzz / ClusterFuzzLite lane remains the step after this one.
# The deterministic replay of found crashes lives in the normal test suite (tests/core/crbm/fuzz-corpus.test.ts),
# which DOES gate every PR, so a fixed bug stays fixed without paying fuzz time per push.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC nightly — 10 min/target
    - cron: '0 6 * * 0' # 06:00 UTC Sundays — weekly DEEP soak, 60 min/target
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target fuzz budget (seconds)
        default: '600'
  # …and a 60s smoke run when THIS FILE changes, which is the only case the paragraph above leaves uncovered.
  #
  # Without it, no check on a pull request runs a single line of this workflow: it has no other PR trigger, and
  # the only other consumer of upload-artifact is a job gated on `workflow_dispatch`. A Dependabot bump of the
  # actions pinned here (actions/cache, actions/upload-artifact) would go green on every other check, which
  # means "the rest of CI still works", not "this change is fine", and a broken bump would sit here until a
  # nightly failed, or worse, until one silently stopped fuzzing.
  #
  # Scoped to this path alone: the point is to cover edits to the workflow, not to make fuzzing a per-PR gate.
  # The reasoning above holds: fuzzing is a time-budgeted campaign, not a pass/fail gate.
  pull_request:
    paths:
      - .github/workflows/fuzz-nightly.yml

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # The weekly soak fuzzes for `-max_total_time=3600`, and the job runs past that: the installs come first,
    # and the corpus is deliberately accretive, so libFuzzer's startup replay of it grows run over run while
    # that 3600s stays fixed. 120 leaves real headroom. A hand-dispatched campaign can pass an
    # arbitrary `seconds` input; one longer than this needs this raised with it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [deser, crbm, index]
    env:
      # Per-target budget: the weekly deep soak (Sunday cron) gets 60 min; the nightly gets 10 min; the
      # workflow-file smoke run gets 60s, because it is checking that the steps still RUN, not hunting bugs; a
      # manual dispatch overrides all of them. `github.event.schedule` is the cron string that fired the run.
      FUZZ_SECONDS:
        ${{ github.event.inputs.seconds || (github.event_name == 'pull_request' && '60') ||
        (github.event.schedule == '0 6 * * 0' && '3600') || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fuzz:install # jazzer lives in fuzz/package.json, outside the root dependency graph
      # Persist the evolved corpus across nightly runs so coverage accretes instead of restarting from seeds.
      #
      # Split into restore + save rather than the combined `actions/cache`, because that action saves in a post
      # step that runs only on SUCCESS. The corpus that matters most is the one that just produced a crash, and
      # that is exactly the run where the combined action would throw it away — so the next night would restart
      # from the entry before it and have to rediscover the input. `if: always()` on the save keeps it.
      - name: Restore fuzz corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: pnpm fuzz:${{ matrix.target }}
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # `always()`, not `failure()`. A fuzz finding is exactly what this step exists to carry off the runner,
      # and the two cases where one is most likely are the two where `failure()` is FALSE: a job cancelled by
      # `cancel-in-progress` (both crons resolve to refs/heads/main, so the Sunday soak cancels a nightly that
      # is still running) and a job stopped by `timeout-minutes` — and a hung input IS a finding. Under
      # `if: failure()` the reproducer would be discarded at precisely the moment it was produced.
      #
      # It also makes the smoke run REACH this step: under `if: failure()` alone a green smoke run would skip it,
      # and a bump of upload-artifact would reach `main` with both its call sites unexecuted.
      # `if-no-files-found: ignore` makes the clean case a no-op, so running always costs one resolved action and
      # uploads nothing.
      - name: Upload crash reproducers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/crashes/
          if-no-files-found: ignore
