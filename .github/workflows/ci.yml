name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets the Lambda-layer artifact be built on demand

permissions:
  contents: read

# Cancel superseded runs on a branch/PR (saves runner time); always build every commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: build & test (node ${{ matrix.node }})
    # GitHub-hosted, everywhere. A `CI_RUNNER` variable used to allow a self-hosted runner to save minutes
    # while the repo was private; that is now both pointless (Actions is free on public repos) and unsafe (a
    # fork's pull request would execute on the runner's host). The toggle is gone rather than left unset.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm format:check
      # The /demo page claims to replay a MEASURED benchmark run. This fails if site-final/assets/replay.json
      # or the page's own numbers have drifted from bench/scale-results.json — including a figure the
      # benchmark cannot account for at all, which is how an invented number got onto a page once already.
      - run: pnpm site:replay:check
      # /benchmarks claims every figure on it is gated. This is that gate: each cost anchor is checked against
      # bench/results.json and docs/benchmarks.md, and the check ALSO fails on a figure the sources cannot
      # account for — so a number cannot quietly improve without evidence.
      - run: pnpm site:figures
      # Markup must not reference a class the stylesheet never declares, and no internal link may 404.
      - run: python3 scripts/site-classes.py
      - run: python3 scripts/site-links.py
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The built package must import cleanly under BOTH module systems (guards the roaring CJS→ESM interop).
      - run: node scripts/smoke.cjs

  dependency-audit:
    name: dependency audit (prod, high)
    # Blocks on a new high/critical advisory in a RUNTIME dependency; triaged build-time advisories are
    # allow-listed in package.json > pnpm.auditConfig.ignoreGhsas with rationale in SECURITY.md (test-strategy T6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `node scripts/audit.cjs`, NOT bare `pnpm audit` (that's pnpm's built-in command — it wouldn't run this
      # prod-scoped, allowlist-filtered wrapper, and would red the build on out-of-scope dev-dep advisories).
      - run: node scripts/audit.cjs

  integration:
    name: integration (DynamoDB-Local + MinIO + fake-gcs-server + Azurite + Postgres + Redis + Mongo + Cassandra + MySQL)
    runs-on: ubuntu-latest # needs Docker on the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pull SERIALLY with backoff before starting anything. `docker compose up` pulls all nine images at once,
      # and every public registry throttles a shared GitHub-runner IP: Docker Hub answers with a 6-hour quota
      # (`pull rate limit`), public.ecr.aws with a per-second rate (`Rate exceeded`). The second kind clears in
      # moments, so the fix that actually works is to stop asking for nine things simultaneously. Failing here
      # is a real failure — the retries are what make the difference between throttling and a broken image.
      - name: Pull backend images (serial, with backoff)
        run: |
          set -u
          # One implementation of the retry, shared with rss-gate.sh and lambda-smoke.sh. It used to be inlined
          # here only, which is precisely why those two scripts kept dying on a throttle this loop absorbs.
          . scripts/lib/docker-pull.sh
          rc=0
          for img in $(docker compose config --images); do
            docker_pull_with_backoff "$img" || rc=1
            sleep 2 # still serial: nine simultaneous pulls is what provokes the rate limit in the first place
          done
          exit "$rc"
      # `--wait-timeout` so a stuck backend (e.g. a Cassandra node that never goes healthy) fails the step fast
      # with a clear signal instead of hanging until the job timeout. Images are already local by now.
      - run: docker compose up -d --wait --wait-timeout 300
      - run: pnpm test:integration
      - if: always()
        run: docker compose down

  lambda-smoke:
    name: lambda deployability (Amazon Linux 2023)
    # Proves the packaged lib deploys to the flagship serverless target: builds the native `roaring` dep for
    # the AL2023 Lambda runtime (no linux prebuilt exists → build-for-target) and loads it under ESM + CJS.
    # Needs Docker on the runner, which fixes the arch tested at x64. arm64/Graviton coverage is not claimed
    # by this job; the cross-OS addon build is covered by `native-os-matrix`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lambda-smoke

  rss-gate:
    name: hard RSS ceiling (cgroup --memory)
    # The DEFINITIVE peak-RSS bound the soak's leak-watch can't prove (the production-readiness review's top residual):
    # runs a sustained write+read+compact workload under a hard cgroup `--memory` limit (swap off) and fails if
    # it's OOM-killed (exit 137) — i.e. if any memory bound (HOT LRU / cold-reader cache / intersection window)
    # regressed to unbounded. Includes the roaring addon's off-heap native memory, which a JS-heap sample can't.
    # Needs Docker on the runner (like integration + lambda-smoke).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rss-gate

  native-os-matrix:
    name: native addon (${{ matrix.os }}, node ${{ matrix.node }})
    # The `roaring` native addon must build + load across the OSes we claim to support. This was gated behind
    # manual dispatch only because Windows/macOS runners bill at 2x/10x on a PRIVATE repo — the gate's own note
    # said to make it always-on at go-public. The repo is public and those minutes are free, so it now runs on
    # every push and PR: for a library whose hardest portability risk is a native addon, "we support these
    # platforms" should be a tested claim, not an on-demand one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves + builds/loads roaring for this OS + node ABI
      - run: pnpm build
      - run: node scripts/smoke.cjs # loads the addon + round-trips under ESM + CJS on this OS

  lambda-layer:
    name: prebuilt Lambda layer (Amazon Linux 2023)
    # Builds a ready-to-attach AWS Lambda layer (roaring compiled for AL2023) and uploads it as a run artifact.
    # Still manual-only, and NOT for cost reasons: it produces a release convenience artifact, not a correctness
    # signal, and `lambda-smoke` already proves the same build works on every push. Needs Docker.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-lambda-layer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-roaring-lambda-layer
          path: dist-lambda/cloud-roaring-lambda-layer.zip
          if-no-files-found: error
