name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets the gated native-OS-matrix + lambda-layer jobs be triggered on demand while private

permissions:
  contents: read

# Cancel superseded runs on a branch/PR (saves runner time); always build every commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: build & test (node ${{ matrix.node }})
    # Zero-cost runner toggle: set the `CI_RUNNER` repo variable to `self-hosted` to run on a local runner
    # (free minutes — private repos ONLY); unset it for GitHub-hosted runners (free on public repos). See the
    # self-hosted-runner guide.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The built package must import cleanly under BOTH module systems (guards the roaring CJS→ESM interop).
      - run: node scripts/smoke.cjs

  dependency-audit:
    name: dependency audit (prod, high)
    # Blocks on a new high/critical advisory in a RUNTIME dependency; triaged build-time advisories are
    # allow-listed in package.json > pnpm.auditConfig.ignoreGhsas with rationale in SECURITY.md (test-strategy T6).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }} # zero-cost toggle (see build-test)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `node scripts/audit.cjs`, NOT bare `pnpm audit` (that's pnpm's built-in command — it wouldn't run this
      # prod-scoped, allowlist-filtered wrapper, and would red the build on out-of-scope dev-dep advisories).
      - run: node scripts/audit.cjs

  integration:
    name: integration (DynamoDB-Local + MinIO + fake-gcs-server + Azurite + Postgres + Redis + Mongo + Cassandra + MySQL)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }} # zero-cost toggle (see build-test) — needs Docker on the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--wait-timeout` so a stuck backend (e.g. a Cassandra node that never goes healthy) fails the step fast
      # with a clear signal instead of hanging until the job timeout.
      - run: docker compose up -d --wait --wait-timeout 300
      - run: pnpm test:integration
      - if: always()
        run: docker compose down

  lambda-smoke:
    name: lambda deployability (Amazon Linux 2023)
    # Proves the packaged lib deploys to the flagship serverless target: builds the native `roaring` dep for
    # the AL2023 Lambda runtime (no linux prebuilt exists → build-for-target) and loads it under ESM + CJS.
    # Needs Docker on the runner; the runner's arch decides the arch tested (arm64/Graviton on the self-hosted
    # Mac, x64 on GitHub-hosted). A full x64 + multi-OS matrix is deferred to the public-launch runners.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }} # zero-cost toggle (see build-test)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lambda-smoke

  rss-gate:
    name: hard RSS ceiling (cgroup --memory)
    # The DEFINITIVE peak-RSS bound the soak's leak-watch can't prove (96-PRODUCTION-READINESS residual #1):
    # runs a sustained write+read+compact workload under a hard cgroup `--memory` limit (swap off) and fails if
    # it's OOM-killed (exit 137) — i.e. if any memory bound (HOT LRU / cold-reader cache / intersection window)
    # regressed to unbounded. Includes the roaring addon's off-heap native memory, which a JS-heap sample can't.
    # Needs Docker on the runner (like integration + lambda-smoke).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }} # zero-cost toggle (see build-test)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rss-gate

  native-os-matrix:
    name: native addon (${{ matrix.os }}, node ${{ matrix.node }})
    # The `roaring` native addon must build + load across the OSes we claim to support. This burns PAID minutes
    # on a PRIVATE repo (Windows/macOS runners are billed at 2x/10x), and is FREE once the repo is public — so
    # it's gated: it runs on manual `workflow_dispatch`, or set-and-forget by defining the repo variable
    # `OS_MATRIX=true`. At the Phase 9 go-public it should become always-on (drop the `if:`).
    if: github.event_name == 'workflow_dispatch' || vars.OS_MATRIX == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves + builds/loads roaring for this OS + node ABI
      - run: pnpm build
      - run: node scripts/smoke.cjs # loads the addon + round-trips under ESM + CJS on this OS

  lambda-layer:
    name: prebuilt Lambda layer (Amazon Linux 2023)
    # Builds a ready-to-attach AWS Lambda layer (roaring compiled for AL2023) and uploads it as a run artifact.
    # Gated (manual dispatch): it's a release convenience, not a per-PR correctness gate. Needs Docker.
    if: github.event_name == 'workflow_dispatch' || vars.OS_MATRIX == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-lambda-layer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-roaring-lambda-layer
          path: dist-lambda/cloud-roaring-lambda-layer.zip
          if-no-files-found: error
