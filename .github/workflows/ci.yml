name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets the Lambda-layer artifact be built on demand

permissions:
  contents: read

# Cancel superseded runs on a branch/PR (saves runner time); always build every commit on main.
#
# `event_name` is in the group because without it a `workflow_dispatch` of the lambda-layer build shares a group
# with ordinary pushes to the same branch: dispatching the artifact build and then pushing cancels the build (or
# the reverse). They are different intents on the same ref, and only one of them is cheap to redo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: build & test (node ${{ matrix.node }})
    # GitHub-hosted, everywhere, with no switch to a self-hosted runner: one would be pointless (Actions is free
    # on public repos) and unsafe (a fork's pull request would execute on the runner's host).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # The whole history, not just the commit. `tests/docs/calibration-reports.test.ts` proves each committed
      # calibration evidence file was written once and never edited, which means reading the file's history out
      # of git. On the default shallow checkout it cannot, and it is written to fail loudly rather than pass
      # vacuously, so the history has to be here. So do `tests/docs/changelog-released-sections.test.ts` (the
      # release tags) and `tests/docs/changelog-unreleased-kept.test.ts` (the merge base with `origin/main`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `fuzz/` installs separately (`--ignore-workspace`), so the root `--frozen-lockfile` above never
      # validates `fuzz/pnpm-lock.yaml`. Its only consumer is the nightly fuzz workflow, which has no PR
      # trigger — so without this step, editing `fuzz/package.json` without regenerating the lockfile passes
      # every PR check and breaks a nightly run, where the failure is attached to no change. `--lockfile-only`
      # resolves without downloading: 0.6s to put that failure on the PR that causes it.
      - run: pnpm -C fuzz install --ignore-workspace --frozen-lockfile --lockfile-only
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm format:check
      # The /demo page claims to replay a MEASURED benchmark run. This fails if the page's numbers have drifted
      # from bench/scale-results.json — including a figure the benchmark cannot account for at all, which is
      # how a number no run produced would reach the page.
      - run: pnpm site:replay:check
      # The at-scale table on /benchmarks and in docs/benchmarks.md is rendered from the same file. This fails
      # if either copy is not what that file renders: a hand edit, or new results rendered into one page only.
      - run: pnpm bench:scale:check
      # /benchmarks claims every figure on it is gated. This is that gate: each cost anchor is checked against
      # bench/results.json and docs/benchmarks.md, and the check ALSO fails on a figure the sources cannot
      # account for — so a number cannot quietly improve without evidence.
      - run: pnpm site:figures
      # Markup must not reference a class the stylesheet never declares, and no internal link may 404.
      - run: python3 scripts/site-classes.py
      - run: python3 scripts/site-links.py
      - run: pnpm typecheck
      # The reporter records every test's duration and budget in this one run (no second run).
      - run: pnpm test --reporter=default --reporter=./scripts/test-budget-reporter.mjs
        # A stalled test run ends the job in 15 minutes, not at the job limit. A normal one takes 6 to 11 (measured: the
        # test step took 373 to 681 s across the last ten successful runs on main and the last ten on pull requests,
        # both Node versions, which leg is slower varying from run to run), so the limit is 1.35 times the slowest run
        # seen, rounded to the minute: tight enough to end a stall early, with room for a slow runner.
        timeout-minutes: 15
      # Fails a test, or a suite's hooks, that used more than half of its time budget, and fails when the run left no
      # report: a test near its budget is the next flake.
      - run: node scripts/test-budget.cjs
      - run: pnpm build
      # `pnpm test` runs before the build, so the spawned-bin tests skip there; here they run against the built bin
      # and fail if it is missing.
      - run: pnpm exec vitest run tests/bin/export-segments-cli.test.ts
        env:
          CB_REQUIRE_BUILT_BIN: '1'
      # Every public type signature, read from the declarations the build just emitted, against the committed snapshot
      # in api-surface/. `tests/docs/api-reference-sync.test.ts` guards the names an entry point exports; this guards
      # what each name accepts and returns, so a changed parameter type or a removed overload cannot merge unseen.
      # After an intended change, regenerate with `pnpm api:surface`.
      - run: pnpm api:surface:check
      # Against the base branch, which needs no build, is `.github/workflows/api-surface-base.yml`: it also runs when a
      # pull request is retargeted, which this workflow does not.
      # bench/sizing.cjs writes the generated regions of the sizing guide, the cost guide, the
      # explainer and the README's Why section, and the explainer's charts in both themes. This fails if any is not
      # what the built estimator gives, on a SIZING marker it would not check, and on a figure typed outside a region
      # of a page that says its figures are generated — after a change to the model, the prices or a profile,
      # regenerate them with `pnpm bench:sizing`.
      - run: pnpm bench:sizing:check
      # The cost model prices a cold intersect at the range requests the engine makes of it, which bench/range-counts.cjs
      # counts by running the built engine over the in-memory backend. This fails if bench/range-counts.json is not what
      # it makes now; regenerate with `pnpm bench:range-counts`. It measures nothing on a cloud.
      - run: pnpm bench:range-counts:check
      # The guide's and the changelog's requests for a refresh-shaped materializeMany call are counted by
      # bench/materialize-many-counts.cjs over the in-memory backend. This recounts its small shape and fails if the committed
      # file is not what the library makes; regenerate with `pnpm bench:materialize-many-counts`. It measures nothing on a cloud.
      - run: pnpm bench:materialize-many-counts:check
      # The requests and bytes of a combine count against the stream-and-count recipe and the `*Into` workaround are counted by
      # bench/combine-counts.cjs over the in-memory backend, with its stop rule in the file. This recounts every shape and fails
      # if the committed record is not what the engine makes; regenerate with `pnpm bench:combine-counts`. It measures nothing on a cloud.
      - run: pnpm bench:combine-counts:check
      # The site's figures gate holds the pages to the figures the engine is expected to cost, which it reads from
      # bench/expected-figures.json so it needs no build. This fails if that file is not what the built estimator gives
      # from bench/range-counts.json and bench/results.json; regenerate with `pnpm bench:expected-figures`.
      - run: pnpm bench:expected-figures:check
      # And bench/run.cjs writes the crossover chart, bench/results.json and the benchmarks pages' BENCH regions,
      # which scripts/site-figures.cjs then treats as a source: without this, a stale results.json would vouch for
      # the site. Regenerate with `pnpm bench`.
      - run: pnpm bench:check
      # bench/event-loop.cjs measured the event-loop figures in the guide's "What blocks the event loop" section and in
      # two source comments. This fails if any of them is not what bench/event-loop-results.json says. It measures
      # nothing, since CI hardware is not the hardware that measured; re-measure by hand with `pnpm bench:event-loop`.
      - run: pnpm bench:event-loop:check
      # bench/load-input.cjs measures a load from ids against one from a bitmap. This fails if the loading guide's
      # "How fast a bitmap loads" figures are not what bench/load-input-results.json says, or, while nothing is
      # recorded, if the guide quotes any. It measures nothing; re-measure by hand with `pnpm bench:load-input`.
      - run: pnpm bench:load-input:check
      # bench/ts-codec.cjs times the TypeScript codec against the native one. This times nothing: it runs every operation
      # once on both and fails if their answers differ, so the instrument cannot rot unseen.
      - run: pnpm bench:ts-codec:check
      # bench/ts-codec-engine.cjs times the store's own reads and writes under each codec. This times nothing a bound
      # reads: it runs every cell once on tiny data and fails if the output is malformed, the codecs disagree, a store
      # ran the wrong codec or the codecs wrote different bytes.
      - run: pnpm bench:ts-codec-engine:check
      # bench/count-kernels.cjs times the counting operations of the TypeScript codec against building the result. This
      # times nothing: it runs every cell once on tiny data and fails if a count differs from the built result, a cell is
      # missing, or the head does not time the count.
      - run: pnpm bench:count-kernels:check
      # bench/ts-codec-paired.cjs times a change to the TypeScript codec against its base commit. This times nothing: it
      # runs every part once at a tiny scale and fails if the output is malformed or the subjects disagree on an answer.
      # It extracts the base from history, which this job's full clone has, and it imports the built entry, so it runs
      # after the build.
      - run: pnpm bench:ts-codec-paired:check
      # bench/bitmap-api.cjs times the public bitmap class against the `roaring` package and the codec's own call. This
      # times nothing a bound reads: it runs every cell once at a tiny scale from the built package and fails if the output
      # is malformed or the subjects disagree on an answer, so it runs after the build.
      - run: pnpm bench:bitmap-api:check
      # The "against native" table on the API reference and the codec page is generated from
      # bench/bitmap-api-results.json; this fails if a region is not what the record renders to.
      - run: pnpm bench:bitmap-api:table:check
      # The built package must import cleanly under BOTH module systems (guards the `require()` of the ESM-only entries).
      - run: node scripts/smoke.cjs
      # Both secret scanners, HERE and not only in the release workflow.
      #
      # Were `release.yml` their only caller, a false positive in the tarball scan would make `main` unreleasable
      # while every check on this page stayed green, and nobody would find out until release day. Running them on
      # each PR turns that into a red check next to the commit that causes it. Together they take about a second,
      # and `pnpm build` has already run, so the tarball scan is nearly free — and the tracked-tree scan cannot
      # stand in for it: it does not read what only the build writes, and outside `--snapshot` it reports the
      # migration class without failing, which the tarball scan fails on whenever the needles are set.
      #
      # BOTH get the needles. Without `LEAK_SCAN_EXTRA`, the tracked-tree scan runs with its most important
      # class — employer names and other project-specific strings — switched OFF, printing "not being checked"
      # and exiting 0. That is the class a committed benchmark results file would leak, and the PR is where it
      # should be caught: by release day the commit is already on `main` and in every fork's history.
      #
      # An unset secret resolves to the empty string, which both scans read as no needles — so this is safe
      # before the secret exists and starts working the moment it does. Secrets are not exposed to pull
      # requests from forks, so a fork PR still scans without them; the tracked-tree scan on `main` after
      # merge is what covers that.
      - run: node scripts/leak-scan.cjs
        env:
          LEAK_SCAN_EXTRA: ${{ secrets.LEAK_SCAN_EXTRA }}
      - run: node scripts/leak-scan-tarballs.cjs
        env:
          LEAK_SCAN_EXTRA: ${{ secrets.LEAK_SCAN_EXTRA }}

  dependency-audit:
    name: dependency audit (prod, high)
    # Blocks on a new high/critical advisory in a RUNTIME dependency; triaged build-time advisories are
    # allow-listed in package.json > pnpm.auditConfig.ignoreGhsas with rationale in SECURITY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `node scripts/audit.cjs`, NOT bare `pnpm audit` (that's pnpm's built-in command — it wouldn't run this
      # prod-scoped, allowlist-filtered wrapper, and would red the build on out-of-scope dev-dep advisories).
      - run: node scripts/audit.cjs

  runtime-floor:
    name: the declared runtime floor (node 22.12)
    # `engines` promises `>=22.12`, and nothing else in CI runs it: every other job pins `22` or a `[22, 24]`
    # matrix, and `22` resolves to the latest 22.x, well above the floor. Without this job the
    # floor is a number in a manifest that no job executes, and code depending on anything added after 22.12
    # ships green.
    #
    # 22.12 specifically because that is where `require(esm)` landed, which is the whole reason these
    # ESM-only packages remain loadable from CommonJS. `pnpm smoke` `require()`s every entry through the
    # published exports map, so below the floor it fails with ERR_REQUIRE_ESM rather than passing quietly.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/smoke.cjs

  consumer-install:
    name: consumer install (node ${{ matrix.node }})
    # Packs the six packages as a release does, installs the tarballs with npm into a clean project, and runs code
    # against them under ESM and CommonJS. `smoke` loads the built packages from inside the workspace, where pnpm
    # links them and neither `files` nor the rewrite of `workspace:*` is exercised; this reads only what a tarball
    # holds, so a file missing from `files`, an `exports` path that resolves only in the workspace, a dependency in
    # the wrong field or a blocked install script fails here and not for a user.
    #
    # The npm install resolves the cloud SDKs and their dependencies fresh from the registry, with no lockfile, and
    # runs their install scripts. That is third-party code, so it runs only inside a throwaway container of the
    # official Node image (pulled from a mirror first, then the ECR mirror, then Docker Hub, since each throttles the runners' shared addresses at times): the
    # tarballs and the script mounted read-only, nothing else mounted, no environment passed in. Packing, which
    # runs only the workspace's own locked dependencies, stays on the runner.
    #
    # No cache of any kind here: no `cache:` on setup-node, no cache action. Code that ran in this job could
    # otherwise write an entry a later job, one that holds a secret, would restore and run. No secret here either.
    # The npm is the one each Node image ships with: 10 on 22, 11 on 24. Under a minute.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Each image is pinned by the digest of its manifest list, which a mirror of it serves under the same digest;
      # refresh them as scripts/README.md says.
      matrix:
        include:
          - node: 22
            digest: sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
          - node: 24
            digest: sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          # Off whatever `packageManager` says: this job restores and saves no cache.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: >-
          node scripts/consumer-install.cjs
          --image mirror.gcr.io/library/node:${{ matrix.node }}-bookworm@${{ matrix.digest }}
          --image public.ecr.aws/docker/library/node:${{ matrix.node }}-bookworm@${{ matrix.digest }}
          --image docker.io/library/node:${{ matrix.node }}-bookworm@${{ matrix.digest }}

  integration:
    name: integration (MinIO + fake-gcs-server + Azurite)
    runs-on: ubuntu-latest # needs Docker on the runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The calibration rehearsal test runs the harness, which imports the built packages, and fails without them.
      - run: pnpm build
      # The backends' images are kept in the Actions cache, so a registry that refuses or throttles a pull, as quay.io
      # refuses anonymous pulls of MinIO and Docker Hub throttles the runners' shared IPs, fails a run only
      # when the cache holds no copy (scripts/lib/docker-pull.sh says when a copy is used).
      - uses: ./.github/actions/docker-images-restore
        with:
          name: integration
          files: docker-compose.yml
      # An image the cache does not serve is pulled one at a time, with backoff, before anything starts: `docker
      # compose up` pulls them all at once, and every public registry throttles a shared GitHub-runner IP. Failing
      # here is a real failure: the retries are what make the difference between throttling and a broken image.
      - name: Load or pull backend images (serial, with backoff)
        run: scripts/ci-backend-images.sh "$RUNNER_TEMP/backend-images.yml"
      # `--wait-timeout` so a stuck backend (e.g. an Azurite container that never goes healthy) fails the step fast
      # with a clear signal instead of hanging until the job timeout. Every image is local by now, the override runs
      # each service on its local copy, and `--pull never` keeps compose from pulling behind the helper's back.
      - run: docker compose -f docker-compose.yml -f "$RUNNER_TEMP/backend-images.yml" up -d --pull never --wait --wait-timeout 300
      - run: pnpm test:integration
      # Kept only from a run that passed: a month's entry is never written again, so one saved by a run missing an
      # image, or on a broken build of a tag, would stand for the month.
      - uses: ./.github/actions/docker-images-save
      - if: always()
        run: docker compose down

  lambda-smoke:
    name: lambda deployability (Amazon Linux 2023)
    # Proves the packaged lib loads on the flagship serverless target: unpacks the packed flavor and engine into a
    # `node_modules`, mounts it into the AL2023 Lambda runtime image, checks that no native addon is installed, and
    # loads and round-trips the library under ESM + CJS. Nothing is built or installed in the container.
    # Needs Docker on the runner, which fixes the arch tested at x64. arm64/Graviton coverage is not claimed
    # by this job; the packages are the same JavaScript on both, and `cross-os` loads them on three operating systems.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Its image is kept in the Actions cache, as the integration job's are.
      - uses: ./.github/actions/docker-images-restore
        with:
          name: lambda-smoke
          files: scripts/lambda-smoke.sh
      - run: pnpm lambda-smoke
      - uses: ./.github/actions/docker-images-save

  rss-gate:
    name: hard RSS ceiling (cgroup --memory)
    # The DEFINITIVE peak-RSS bound the soak's leak-watch can't prove:
    # runs a sustained read+combine+re-load workload under a hard cgroup `--memory` limit (swap off) and
    # fails if it's OOM-killed (exit 137) — i.e. if any memory bound (CACHE LRU / storage-reader cache / intersection
    # window) regressed to unbounded. Measures the whole process, which a JS-heap sample can't.
    #
    # The "intersection window" clause holds because the workload issues combines, and the soak refuses to report
    # PASS on a run that performed none: without combines this gate could not observe the window no matter what
    # regressed. The window's structural bound (at most
    # `concurrency × operands` payloads in flight, independent of segment size) is proven separately and
    # deterministically in tests/core/intersect-window-bounded.test.ts — this gate covers accumulation over time,
    # which a unit test cannot.
    # Needs Docker on the runner (like integration + lambda-smoke).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Its image is kept in the Actions cache, as the integration job's are: public.ecr.aws answers `Data limit
      # exceeded` once the runners' shared IPs pass its anonymous quota, and a refused pull would fail this job.
      - uses: ./.github/actions/docker-images-restore
        with:
          name: rss-gate
          files: scripts/rss-gate.sh
      - run: pnpm rss-gate
      # The gate's record is the file this run wrote; the committed copy is taken from here, never edited by hand.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rss-gate-results
          path: bench/rss-gate-results.json
          if-no-files-found: warn
      - uses: ./.github/actions/docker-images-save

  cross-os:
    name: cross-OS (${{ matrix.os }}, node ${{ matrix.node }})
    # The built packages must install, build, load under ESM and CJS and round-trip on every OS we claim to support:
    # Linux, macOS and Windows. They hold no native code, so this proves the JavaScript runs there, not that an addon
    # builds. It runs on every push and PR, because on a public repo the Windows and macOS minutes are free and "we
    # support these platforms" should be a tested claim, not an on-demand one. The oracle's `roaring` devDependency is
    # still installed and still a native binary on these runners, which is why its checksum check runs here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves the workspace, and the oracle's `roaring` binary for this OS + node ABI
      # `--strict` is the point. Without it an UNKNOWN key prints `RECORD …` and exits 0 — and every key
      # carries the roaring version, so a version bump makes all six unknown and all six of these jobs pass
      # having verified nothing. Dependabot groups minor+patch monthly under `patterns: ['*']`, so that bump
      # arrives in a routine PR that, without `--strict`, goes fully green while installing an unverified
      # native binary on the runners. With it, a new version fails until a human runs the script, reads the
      # printed hashes and records them. Only the oracle installs `roaring` now; the check goes when it does.
      - run: node scripts/verify-roaring-prebuilt.cjs --strict # the oracle's addon checksum, per platform
      - run: pnpm build
      - run: node scripts/smoke.cjs # loads the built packages + round-trips under ESM + CJS on this OS
      # The default macOS volume is case-insensitive, which is what LocalFs's exact-case checks are for. The variable
      # makes the test fail, not skip, if this runner's temp root is case-sensitive.
      - name: LocalFs exact-case checks on a case-insensitive filesystem
        if: runner.os == 'macOS'
        run: pnpm exec vitest run tests/drivers/localfs/exact-case.test.ts
        env:
          CB_EXPECT_CASE_INSENSITIVE: '1'

  lambda-layer:
    name: prebuilt Lambda layer (Amazon Linux 2023)
    # Builds a ready-to-attach AWS Lambda layer (the flavor and the engine, JavaScript only, loaded once from /opt in the
    # AL2023 runtime image before it is kept) and uploads it as a run artifact.
    # Manual-only, and NOT for cost reasons: it produces a release convenience artifact, not a correctness
    # signal, and `lambda-smoke` already proves the packages load there on every push. Needs Docker.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
