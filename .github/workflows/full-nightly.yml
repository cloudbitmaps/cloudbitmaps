name: Full-strength tests (nightly)

# The whole unit suite (`pnpm test`, integration excluded) at FULL strength, on `main`, every night, and on demand.
#
# A pull request runs `pnpm test` with the heavy tests at a reduced size (see `tests/helpers/strength.ts`): fewer
# property cases, a smaller listing, fewer measured bitmaps. That keeps a push cheap. This workflow is what keeps the
# coverage: `CB_TEST_STRENGTH=full` makes each of those tests run the size it had before the reduction, so a
# regression only the large size can show is caught within a day, on `main`, instead of never.
#
# It does not gate a pull request and is not among the required checks. A red run fails THIS workflow run: it shows
# red on the Actions tab for `main`. GitHub notifies one user for a scheduled run, whoever last changed the cron line
# (the workflow's creator before that), as that user's notification settings allow; for a manual dispatch, the person
# who started it. A property suite's failure is a counterexample, not a flake: replay it with the seed in the log
# (`FC_SEED=<seed> CB_TEST_STRENGTH=full pnpm vitest run <file>`); the next night draws new cases and may well be green.
#
# Same Node versions as the `build & test` matrix in ci.yml; `tests/ci/runtime-version-policy.test.ts` holds both.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly, an hour before the fuzz campaign starts
  workflow_dispatch:
  # A full-strength run (the whole unit suite, a few minutes a Node version) when this file, the switch or one of the
  # heavy tests changes, so the pull request that touches them has run them at their full size. Without it nothing on a
  # pull request would run a line of this workflow. `tests/ci/test-strength.test.ts` holds the list to the heavy tests
  # `tests/helpers/strength.ts` names.
  pull_request:
    paths:
      - .github/workflows/full-nightly.yml
      - tests/helpers/strength.ts
      - tests/bench/calibrate-large.test.ts
      - tests/core/combine-many.property.test.ts
      - tests/core/combine-many.feed.property.test.ts
      - tests/core/retention-hard-purge.test.ts
      - tests/core/erase-namespace-bounded.test.ts
      - tests/core/combine-ledger.test.ts
      - tests/core/load-sorted-heap.test.ts

permissions:
  contents: read

# Per event, as in ci.yml, and a run is cancelled only on a pull request: a manual dispatch on `main` must not cancel the
# night's scheduled run, which would end grey with no failure notice.
concurrency:
  group: full-nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    name: full-strength tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CB_TEST_STRENGTH: full
    steps:
      # The whole history, for the same reason as in ci.yml: the docs tests read the release tags, the merge base and
      # the history of each committed calibration file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        # A stalled test run ends the job in 15 minutes (a normal one takes 5 to 8), not at the job limit.
        timeout-minutes: 15
