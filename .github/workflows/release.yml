# Release — publish to npm with build provenance (supply-chain hardening).
#
# A tag push publishes for real; a manual run defaults to **dry-run** (pack + `publish --dry-run`, no
# upload), so the pipeline can be exercised without pushing a version.
#
# Supply-chain guarantees this pipeline enforces:
#   - **Tokenless auth (npm Trusted Publishing)**: there is **NO long-lived `NPM_TOKEN`**. npm authenticates
#     the publish from the GitHub OIDC identity of this workflow, so there is no repo secret that can leak,
#     be exfiltrated by a malicious dependency, or need rotating. Matches the sibling projects (onadiet,
#     babystack) and is what lets each package be set to *"require 2FA and disallow tokens"* on npm — that
#     setting REJECTS an automation-token publish outright, so token auth and that hardening are mutually
#     exclusive. Trusted Publishing is not a token, so it passes.
#   - **Human gate**: the publish job runs in the protected `release` environment, whose required reviewer is
#     the approval prompt. Nothing reaches npm without a person clicking approve.
#   - **Provenance**: `NPM_CONFIG_PROVENANCE=true` records a signed, verifiable link from the published tarball
#     back to THIS workflow + commit (SLSA build provenance via GitHub OIDC). Requires `id-token: write` and a
#     GitHub-hosted runner, so `runs-on` is pinned to `ubuntu-latest`. A self-hosted runner has no OIDC
#     identity to attest to and would silently cost the attestation.
#   - **Frozen, reproducible install**: `pnpm install --frozen-lockfile` (fails if the lockfile is stale).
#   - **Publish only a fully-verified tree**: the complete CI gate (lint · arch · format · typecheck · test ·
#     build · smoke) runs here again before the tarball is created — a green `main` is necessary but not
#     sufficient; the exact commit being published is re-verified.
#   - **SHA-pinned Actions**: every `uses:` is pinned to a full commit SHA (a moved tag can't inject code).
#   - **Version/tag agreement**: a `vX.Y.Z` tag must match `package.json` version, or the run fails.
# Prerequisites (one-time, outside this file — see RELEASING.md):
#   1. npmjs.com → each published package (`@cloudbitmaps/core`, `@cloudbitmaps/roaring`, `@cloudbitmaps/s3`,
#      `@cloudbitmaps/gcs`, `@cloudbitmaps/azure-blob`) → Trusted Publisher:
#      GitHub Actions, repo `cloudbitmaps/cloudbitmaps`, workflow `release.yml`, environment `release`.
#      A publisher can only be bound to a package that ALREADY EXISTS on the registry, so the very first
#      version is published manually with interactive 2FA to create the names (see RELEASING.md "First
#      publish"). Every release after that runs through here, tokenless.
#   2. GitHub → Settings → Environments → `release`, with the maintainer as a **required reviewer**.
#      That reviewer IS the gate; without it the publish job would run unpaused.

name: Release

on:
  push:
    tags: ['v*.*.*'] # a real publish is triggered by pushing a version tag
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (pack + publish --dry-run, no upload)'
        type: boolean
        default: true

# Least privilege at the top level: read the repo, mint an OIDC token for provenance. No write scopes.
# `contents: write` is granted to the github-release job ONLY, never to the job that publishes.
permissions:
  contents: read
  id-token: write

# One release at a time, and NEVER cancel one in flight. `cancel-in-progress: false` is the opposite of the
# CI workflow's setting, deliberately: cancelling a build is free, but cancelling a release is not — kill a run
# mid-run and npm holds a half-published family — some of the five up, the rest not — that cannot be
# unpublished back out. The group is the workflow, not the ref, so two different tags pushed together queue rather than
# race for the same version pointers.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# How many manifests `packages/*/package.json` must match. A glob that comes back short means a package was
# renamed, moved or lost — and the family releases in lockstep, so a short glob is a PARTIAL publish waiting to
# happen, not a smaller release. Stated once here; `tests/ci/release-workflow.test.ts` asserts it still equals
# the number of packages in the workspace, so adding one fails the gate instead of silently under-releasing.
env:
  EXPECTED_PACKAGES: 5

jobs:
  publish:
    name: publish (tokenless, provenance)
    runs-on: ubuntu-latest # provenance needs a GitHub-hosted runner's OIDC identity — never a self-hosted one
    environment: release # manual-approval gate (required reviewer on the environment)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the runner's bundled npm is older. A FLOOR, not
      # `@latest`: `@latest` silently makes every release depend on whatever npm shipped that morning, so a
      # regression in a brand-new npm becomes a broken release with no change on our side and nothing in the
      # diff to point at. `^11.5.1` still takes the fixes inside npm 11 while making a major bump a deliberate,
      # reviewable edit to this line.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g 'npm@^11.5.1'

      # Re-run the FULL gate against the exact commit being published (defense in depth vs a green-main assumption).
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # The audit belongs HERE and not only in CI, because it is the one gate whose result changes with no
      # commit at all: an advisory published against a runtime dependency after `main` went green makes this
      # tree newly-vulnerable without touching a byte of it. Re-running the rest of the gate on the release
      # commit and trusting a days-old audit would leave exactly that hole.
      - run: node scripts/audit.cjs
      - run: pnpm build
      - run: node scripts/smoke.cjs

      # A `vX.Y.Z` push must match EVERY publishable package's version exactly (guards a mistagged release).
      # The repo is a pnpm workspace: the ROOT manifest is private and never published, so the versions that
      # matter are the per-package ones — the family releases in lockstep, so all must equal the tag.
      - name: Verify tag matches every package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # `nullglob` + a count check, because the default shell behaviour here fails in the wrong direction:
          # an unmatched glob expands to the LITERAL string `packages/*/package.json`, so the loop below would
          # run exactly once on a path that does not exist. Guard the count explicitly instead of relying on
          # what a `require()` of a nonexistent file happens to do.
          shopt -s nullglob
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}" # see the probe step
          pkgs=(packages/*/package.json)
          if [ "${#pkgs[@]}" -lt "$EXPECTED_PACKAGES" ]; then
            echo "::error::expected $EXPECTED_PACKAGES publishable package manifests, matched ${#pkgs[@]} — refusing to release"
            exit 1
          fi
          fail=0
          for pkg in "${pkgs[@]}"; do
            NAME="$(node -p "require('./$pkg').name")"
            VER="$(node -p "require('./$pkg').version")"
            if [ "$VER" != "$TAG" ]; then
              echo "::error::tag v$TAG does not match $NAME version $VER ($pkg)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # `pnpm publish` SILENTLY SKIPS a `private: true` package — no error, exit 0. Before the launch every
      # package is deliberately private (the last accidental-publish guard), so a real publish attempt would
      # otherwise produce a fully GREEN run that published nothing at all. Fail loudly instead: the release
      # commit that clears `private` is what makes this pass, which is exactly the intended sequencing
      # (see the launch runbook's publish stage).
      - name: Refuse to "publish" a still-private package
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dryRun)
        run: |
          shopt -s nullglob # see the tag-match step above: an unmatched glob would otherwise loop once on a literal
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}" # see the probe step
          pkgs=(packages/*/package.json)
          if [ "${#pkgs[@]}" -lt "$EXPECTED_PACKAGES" ]; then
            echo "::error::expected $EXPECTED_PACKAGES publishable package manifests, matched ${#pkgs[@]} — refusing to release"
            exit 1
          fi
          fail=0
          for pkg in "${pkgs[@]}"; do
            if [ "$(node -p "require('./$pkg').private === true")" = "true" ]; then
              echo "::error::$pkg still has \"private\": true — pnpm would skip it and report success"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # Two things npm will not tell you until it is too late, both of which produce a PARTIAL release of a
      # family that ships in lockstep — the one npm state that cannot be undone.
      #
      #   1. A NAME THAT DOES NOT EXIST YET. This pipeline is tokenless: it authenticates by OIDC against a
      #      Trusted Publisher, which is a per-package npm setting that cannot be bound to a package that has
      #      never been published. `pnpm -r publish` walks the workspace topologically and stops at the first
      #      failure, so a family where `core` is published and a new driver package is not would put
      #      `core@X.Y.Z` on the registry, immutably, and then fail — with the flagship never published at
      #      all. Create the name first (`pnpm release:bootstrap`), bind its Trusted Publisher, then tag.
      #
      #   2. A VERSION THAT IS ALREADY THERE. `pnpm publish` SILENTLY SKIPS a version already on the
      #      registry and exits 0. A re-run, or a tag cut against a version some package was hand-published
      #      at, therefore produces a fully GREEN release that published some packages and quietly skipped
      #      others — which is indistinguishable from success in the log.
      #
      # Both are read-only probes of the registry, so they cost seconds and can only fail BEFORE anything
      # irreversible happens. `npm view` reads a replica that lags for minutes after a first publish, but by
      # release time these names are long-established, so a 404 here means the name genuinely is not there.
      - name: Refuse to publish an unbootstrapped name or a version already on the registry
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dryRun)
        run: |
          shopt -s nullglob # see the tag-match step: an unmatched glob would otherwise loop once on a literal
          # `[ 5 -lt "" ]` is a bash ERROR (status 2), and as an `if` CONDITION that does not trip `set -e` —
          # so an unset variable would silently skip the guard below rather than fail it.
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}"
          pkgs=(packages/*/package.json)
          # And with nullglob an unmatched glob loops ZERO times, so this guard would pass having probed
          # nothing at all — the exact vacuous-check shape the other two steps already defend against.
          if [ "${#pkgs[@]}" -lt "$EXPECTED_PACKAGES" ]; then
            echo "::error::expected $EXPECTED_PACKAGES publishable package manifests, matched ${#pkgs[@]} — refusing to release"
            exit 1
          fi
          fail=0
          for pkg in "${pkgs[@]}"; do
            NAME="$(node -p "require('./$pkg').name")"
            VER="$(node -p "require('./$pkg').version")"
            # Both probes must fail CLOSED. `npm view` exits non-zero for a missing name AND for a 5xx, a
            # rate limit or a timeout, so a transient failure on the VERSION probe used to be read as "this
            # version is not published" and the run proceeded — straight into the silent-skip it exists to
            # prevent. Classify on the error text and refuse anything that is not a clean 404.
            # `x="$(cmd)"; rc=$?` does NOT work under `set -e` (the Actions default shell): the failing
            # substitution aborts the step before `$?` is ever read, so the guard fails closed but SILENTLY,
            # with no ::error:: line to tell the operator which package or why. `|| rc=$?` keeps the command
            # in a list, where `set -e` is suppressed.
            probe_rc=0
            probe_err="$(npm view "$NAME" version 2>&1 >/dev/null)" || probe_rc=$?
            if [ "$probe_rc" -ne 0 ] && ! printf '%s' "$probe_err" | grep -qiE 'code E404|404 Not Found|is not in th'; then
              echo "::error::could not reach the registry to check $NAME — refusing to release rather than guess. $probe_err"
              fail=1
            elif [ "$probe_rc" -ne 0 ]; then
              echo "::error::$NAME does not exist on the registry. A Trusted Publisher cannot be bound to a package that has never been published, so this tokenless workflow cannot create it — run \`pnpm release:bootstrap\` to create the name, bind its Trusted Publisher on npmjs.com, then re-tag. Releasing now would publish the packages that DO exist and fail on this one, leaving a partial, immutable release."
              fail=1
            else
              ver_rc=0
              ver_err="$(npm view "$NAME@$VER" version 2>&1 >/dev/null)" || ver_rc=$?
              if [ "$ver_rc" -eq 0 ]; then
                echo "::error::$NAME@$VER is already on the registry. pnpm would SKIP it and exit 0, so this run would report success while publishing nothing for it. Bump the version."
                fail=1
              elif ! printf '%s' "$ver_err" | grep -qiE 'code E404|404 Not Found|is not in th'; then
                echo "::error::could not reach the registry to check $NAME@$VER — refusing to release rather than guess. $ver_err"
                fail=1
              fi
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # Everything that can still be FIXED must be checked before the one step that cannot be undone.
      #
      # This is the mirror image of the bug that produced a GitHub Release for a version that never reached npm:
      # there, an irreversible-ish artifact was created before the thing it describes succeeded. Here the notes
      # are extracted in the `github-release` job, which by construction runs AFTER `pnpm publish` — so a missing
      # or empty CHANGELOG section surfaces at the one moment nothing can be done about it. npm tarballs are
      # immutable outside a 72-hour window; a changelog is a two-line edit. Check the cheap thing first.
      #
      # `> /dev/null` because this is purely a precondition — github-release does the real extraction against
      # the same script, so the two cannot disagree.
      - name: Require release notes to exist before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/changelog-section.cjs "${GITHUB_REF_NAME}" > /dev/null

      # Scan what actually ships. The tracked-file and history modes cannot see `dist/` (gitignored), which is
      # most of the published bytes and carries every `src` comment through the sourcemaps' `sourcesContent`.
      # See scripts/leak-scan-tarballs.cjs. Runs on dry-runs too — a dry run whose whole job is to prove the
      # pipeline should exercise the gates, not skip them.
      - name: Leak-scan the packed tarballs
        env:
          # Optional. Set the repo secret to check the employer-name class of needle too; with it the scan runs
          # in the strict SNAPSHOT mode, without it the HARD class (credentials, keys, real addresses, absolute
          # local paths) still fails the build. The script prints which mode it chose, so the weaker mode can
          # never be mistaken for the stronger one.
          LEAK_SCAN_EXTRA: ${{ secrets.LEAK_SCAN_EXTRA }}
        run: node scripts/leak-scan-tarballs.cjs

      # Dry-run on manual dispatch (default): packs + validates only — mints no attestation, needs no auth token.
      # `publishConfig.access=public` + `provenance:true` live in package.json; `--provenance` is explicit here too.
      # `pnpm -r publish` walks the workspace in topological order (core before the flavor that depends on it)
      # and rewrites each `workspace:^` range to the real version. `--no-git-checks` because the tag/branch state
      # is already verified above. The root manifest is `private: true`, so it is skipped automatically.
      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dryRun
        run: pnpm -r --filter './packages/**' publish --provenance --access public --dry-run --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
      # Real, provenance-signed publish — ONLY a pushed vX.Y.Z tag, or an explicit dispatch with dryRun=false.
      # The tag arm is scoped to `push` so that dispatching a run *from* a tag ref (where github.ref is
      # refs/tags/v…) can NOT publish for real while dryRun is still true — that would break the dry-run-default
      # safety contract. NOTE: a dispatch real-publish (dryRun=false) skips the tag↔version guard above and
      # ships whatever package.json declares — intended only for a deliberate, manual release.
      - name: Publish (real)
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dryRun)
        run: pnpm -r --filter './packages/**' publish --provenance --access public --no-git-checks
        env:
          # No NODE_AUTH_TOKEN. npm authenticates from this workflow's OIDC identity (Trusted Publishing);
          # adding a token back here would re-introduce the long-lived secret AND be rejected outright by the
          # packages' "require 2FA and disallow tokens" setting.
          NPM_CONFIG_PROVENANCE: true

  # Cut the GitHub Release from the same tag, with notes lifted verbatim from CHANGELOG.md.
  #
  # A SEPARATE job, deliberately. Creating a release needs `contents: write`, and SECURITY.md's hardening
  # checklist promises the publish job "carries only the OIDC `id-token` permission" — so the write scope lives
  # here, on a job that cannot publish, instead of being added to the job that can. (Both sibling projects let
  # `changesets/action` do this inside the publish job with `contents: write`; that is simpler, and it widens
  # the blast radius of the one job an attacker would most want to influence.)
  #
  # `needs: publish` + the tag condition mean a release object only ever appears for a version that really
  # published. Nothing here is approval-gated a second time: the human already approved the publish, and this
  # job cannot ship code.
  github-release:
    name: github release (notes from CHANGELOG)
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release object; NOT granted to the publish job above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Fails loudly on a missing or empty section rather than publishing blank notes — see
      # scripts/changelog-section.cjs and its tests.
      - name: Extract the release notes
        run: node scripts/changelog-section.cjs "${GITHUB_REF_NAME}" > /tmp/notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
