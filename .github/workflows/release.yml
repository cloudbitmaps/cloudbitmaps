# Release — publish to npm with build provenance (supply-chain hardening).
#
# A tag push publishes for real; a manual run defaults to **dry-run** (pack + `npm publish --dry-run`, no
# upload), so the pipeline can be exercised without pushing a version. A manual run publishes for real
# (`dryRun=false`) only when it is dispatched on a version tag; on a branch it fails before any work.
#
# Two jobs, so that no dependency code runs beside the publish identity:
#
#   verify   Runs everything that executes code from the repo's dependencies, with `contents: read` and NO
#            `id-token` (so nothing in it can mint an OIDC token, and it has no environment). It installs, runs
#            the whole gate, packs each package to a tarball the way a publish would, scans those tarballs and
#            uploads them, with a SHA256SUMS, as one artifact.
#   publish  Needs `verify`, so the reviewer on the `release` environment approves a build that has already
#            passed. It holds `id-token: write` and runs no code from the repo: no checkout, no `pnpm install`,
#            no repo script. It downloads the artifact, checks the sums, installs one exact npm, probes the
#            registry and publishes the tarballs with `npm publish <file> --provenance`.
#   github-release  Needs `publish`; the one job with `contents: write`. See below.
#
# Supply-chain guarantees this pipeline enforces:
#   - **Tokenless auth (npm Trusted Publishing)**: there is **NO long-lived `NPM_TOKEN`**. npm authenticates
#     the publish from the GitHub OIDC identity of this workflow, so there is no repo secret that can leak,
#     be exfiltrated by a malicious dependency, or need rotating. It is also what lets each package be set to
#     *"require 2FA and disallow tokens"* on npm — that setting REJECTS an automation-token publish outright, so
#     token auth and that hardening are mutually exclusive. Trusted Publishing is not a token, so it passes.
#     The Trusted Publisher is bound to this file's name (`release.yml`) and the `release` environment, both of
#     which the publish job keeps.
#   - **Human gate**: the publish job runs in the protected `release` environment, whose required reviewer is
#     the approval prompt. Nothing reaches npm without a person clicking approve, and the prompt comes after
#     `verify` has passed.
#   - **The identity never sits beside dependency code**: the only job with `id-token: write` is `publish`, and
#     it runs nothing from the repo's dependency tree (the workflow's top level grants no `id-token`). A
#     dependency that runs in `verify` can change the tarballs it uploads, which is why the reviewer approves
#     after a verified build and the leak scan covers those very files; it cannot ask for a publish token.
#   - **Provenance**: `NPM_CONFIG_PROVENANCE=true` records a signed, verifiable link from the published tarball
#     back to THIS workflow + commit (SLSA build provenance via GitHub OIDC; the statement names the tarball's
#     sha512 and the workflow run, so it is the same for a tarball as for a directory). Requires
#     `id-token: write` and a GitHub-hosted runner, so `runs-on` is pinned to `ubuntu-latest`. A self-hosted
#     runner has no OIDC identity to attest to and would silently cost the attestation.
#   - **Exact tooling in the publishing job**: npm is installed at one exact version there. A new npm is a
#     reviewed edit (see the step).
#   - **Frozen, reproducible install**: `pnpm install --frozen-lockfile` (fails if the lockfile is stale).
#   - **Publish only a fully-verified tree**: the gate that governs the artifact (lint · lint:arch ·
#     format:check · typecheck · test · audit · build · smoke) runs in `verify` again before the tarballs are
#     created — a green `main` is necessary but not sufficient; the exact commit being published is
#     re-verified. It is not every check CI runs: CI's site, benchmark-page and tracked-tree checks and its
#     other jobs stay there, and RELEASING.md "What the automation does" says why.
#   - **What was verified is what is published**: the tarballs are packed once, scanned once, and published
#     from the artifact after `publish` checks their SHA256SUMS, their count against `EXPECTED_PACKAGES`, and
#     that every one carries the same version (the tag's, on a tag ref).
#   - **SHA-pinned Actions**: every `uses:` is pinned to a full commit SHA (a moved tag can't inject code).
#   - **Version/tag agreement**: every package manifest's `version` must equal the `vX.Y.Z` tag, or the run
#     fails. Every run on a tag ref makes the check, and a real publish runs only on a tag ref: a manual run
#     with `dryRun=false` on a branch fails first, before the checkout.
# Prerequisites (one-time, outside this file — see RELEASING.md):
#   1. npmjs.com → each published package (`@cloudbitmaps/core`, `@cloudbitmaps/roaring`, `@cloudbitmaps/s3`,
#      `@cloudbitmaps/gcs`, `@cloudbitmaps/azure-blob`, `@cloudbitmaps/tools`) → Trusted Publisher:
#      GitHub Actions, repo `cloudbitmaps/cloudbitmaps`, workflow `release.yml`, environment `release`.
#      A publisher can only be bound to a package that ALREADY EXISTS on the registry, so each new name is
#      created first, by hand with interactive 2FA, at a throwaway prerelease (`pnpm release:bootstrap`; see
#      RELEASING.md "Bootstrapping a name"). Every release after that runs through here, tokenless.
#   2. GitHub → Settings → Environments → `release`, with the maintainer as a **required reviewer**.
#      That reviewer IS the gate; without it the publish job would run unpaused.

name: Release

on:
  push:
    tags: ['v*.*.*'] # a real publish is triggered by pushing a version tag
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (pack + publish --dry-run, no upload)'
        type: boolean
        default: true

# Least privilege at the top level: read the repo, nothing else. `id-token: write` (the OIDC token that npm
# Trusted Publishing and provenance need) is granted to the `publish` job ONLY, which runs no dependency code,
# and `contents: write` to the github-release job ONLY. The job that runs the dependencies holds neither.
permissions:
  contents: read

# NEVER cancel a release in flight. `cancel-in-progress: false` is the opposite of the CI workflow's setting,
# deliberately: cancelling a build is free, but cancelling a release is not — kill a run mid-run and npm holds
# a half-published family, some of the six up and the rest not, which cannot be unpublished back out.
#
# The group includes the REF. In a group of the workflow alone, two different tags pushed together do not
# queue: GitHub holds exactly ONE pending run per concurrency group and cancels any earlier pending one, so a
# second tag evicts a first that is still waiting. That wait is not hypothetical: this workflow parks in the
# `release` environment for a required reviewer, which counts as in-progress for as long as the approval
# takes, so a tag pushed (or a dry run dispatched) during that window would silently cancel the queued
# release. The tag would exist with nothing on npm and no Release object, and the only signal would be a
# cancelled run nobody is watching. Per-ref means two tags each get their own slot and cannot evict each
# other, while a repeated push of the SAME ref still cannot start a second concurrent publish — which is the
# property that actually matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# How many manifests `packages/*/package.json` must match. A glob that comes back short means a package is
# renamed, moved or missing — and the family releases in lockstep, so a short glob is a PARTIAL publish waiting to
# happen, not a smaller release. Stated once here; `tests/ci/release-workflow.test.ts` asserts it still equals
# the number of packages in the workspace, so adding one fails the gate instead of silently under-releasing.
env:
  EXPECTED_PACKAGES: 6

jobs:
  verify:
    name: verify (gate, pack, scan)
    runs-on: ubuntu-latest
    # 60 — the job's work is the whole gate, a build and a pack, about 10-15 minutes. It has no environment, so
    # no reviewer wait: a bound a few times the real duration is the right one, and a hung step fails in an hour
    # rather than six. (`publish` is the job with the long bound.)
    timeout-minutes: 60
    # No `id-token`, no write scope, no environment: this job runs every dependency's install scripts and test
    # code, so it holds nothing that could publish or write.
    permissions:
      contents: read
    steps:
      # A real publish by hand is allowed only from a version tag. A dispatch with dryRun=false on a branch
      # (or on any ref that is not a version tag) fails here, first, before the checkout, the install or the build:
      # no dependency code has run and nothing was packed. (A dry run on a branch still works; it never reaches a publish step.)
      - name: Refuse a real publish that does not start from a version tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dryRun && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::a real publish runs only from a version tag (refs/tags/v...); this run is on ${GITHUB_REF}, which is not one. Tag the release and dispatch on the tag, or push the tag."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, as `ci.yml` checks out: `tests/docs/calibration-reports.test.ts` proves each
          # committed calibration evidence file was written once and never edited, which means reading the file's
          # history out of git. On a shallow checkout it cannot, and it fails loudly rather than passing
          # vacuously, so this job, which re-runs the complete gate, needs the history too.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm test` loads the oracle's prebuilt `roaring` binary here: refuse one whose checksum is not recorded.
      - run: node scripts/verify-roaring-prebuilt.cjs --strict

      # Re-run the FULL gate against the exact commit being published (defense in depth vs a green-main assumption).
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # The audit belongs HERE and not only in CI, because it is the one gate whose result changes with no
      # commit at all: an advisory published against a runtime dependency after `main` went green makes this
      # tree newly-vulnerable without touching a byte of it. Re-running the rest of the gate on the release
      # commit and trusting a days-old audit would leave exactly that hole.
      - run: node scripts/audit.cjs
      - run: pnpm build
      # The published declarations are the committed snapshot of every public signature.
      - run: pnpm api:surface:check
      - run: node scripts/smoke.cjs

      # A `vX.Y.Z` push must match EVERY publishable package's version exactly (guards a mistagged release).
      # The repo is a pnpm workspace: the ROOT manifest is private and never published, so the versions that
      # matter are the per-package ones — the family releases in lockstep, so all must equal the tag.
      - name: Verify tag matches every package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # `nullglob` + a count check, because the default shell behaviour here fails in the wrong direction:
          # an unmatched glob expands to the LITERAL string `packages/*/package.json`, so the loop below would
          # run exactly once on a path that does not exist. Guard the count explicitly instead of relying on
          # what a `require()` of a nonexistent file happens to do.
          shopt -s nullglob
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}" # see the pack step
          pkgs=(packages/*/package.json)
          if [ "${#pkgs[@]}" -lt "$EXPECTED_PACKAGES" ]; then
            echo "::error::expected $EXPECTED_PACKAGES publishable package manifests, matched ${#pkgs[@]} — refusing to release"
            exit 1
          fi
          fail=0
          for pkg in "${pkgs[@]}"; do
            NAME="$(node -p "require('./$pkg').name")"
            VER="$(node -p "require('./$pkg').version")"
            if [ "$VER" != "$TAG" ]; then
              echo "::error::tag v$TAG does not match $NAME version $VER ($pkg)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # `npm publish` refuses a `private: true` package, but the run should fail here, before the approval
      # and before the first packages have gone out, rather than part-way through the family.
      #
      # No package carries `private` today (only the workspace root, which is never published). This step is
      # here for the day one does — a new package scaffolded from a template, or a deliberate
      # accidental-publish guard during development that nobody remembered to clear.
      - name: Refuse to "publish" a still-private package
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dryRun)
        run: |
          shopt -s nullglob # see the tag-match step above: an unmatched glob would otherwise loop once on a literal
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}" # see the pack step
          pkgs=(packages/*/package.json)
          if [ "${#pkgs[@]}" -lt "$EXPECTED_PACKAGES" ]; then
            echo "::error::expected $EXPECTED_PACKAGES publishable package manifests, matched ${#pkgs[@]} — refusing to release"
            exit 1
          fi
          fail=0
          for pkg in "${pkgs[@]}"; do
            if [ "$(node -p "require('./$pkg').private === true")" = "true" ]; then
              echo "::error::$pkg still has \"private\": true — it would not publish, and a run must not report success without it"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # Everything that can still be FIXED must be checked before the one step that cannot be undone.
      #
      # The notes are extracted in the `github-release` job, which by construction runs AFTER the publish, so
      # that a Release never describes a version that did not reach npm. Without this step, a missing or empty
      # CHANGELOG section would surface there, at the one moment nothing can be done about it. npm tarballs are
      # immutable outside a 72-hour window; a changelog is a two-line edit. Check the cheap thing first.
      #
      # `> /dev/null` because this is purely a precondition — github-release does the real extraction against
      # the same script, so the two cannot disagree.
      - name: Require release notes to exist before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/changelog-section.cjs "${GITHUB_REF_NAME}" > /dev/null

      # Pack every package to a tarball the way a publish does: `pnpm pack` runs the package's `prepack` (a
      # build) and rewrites each `workspace:*` dependency to the exact version, so the tarball's `package.json`
      # is the one npm will publish. These files are what the next steps scan, checksum and upload, and what
      # the `publish` job publishes.
      - name: Pack every package to a tarball
        run: |
          shopt -s nullglob # see the tag-match step above: an unmatched glob would otherwise loop once on a literal
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}"
          pkgs=(packages/*/package.json)
          if [ "${#pkgs[@]}" -lt "$EXPECTED_PACKAGES" ]; then
            echo "::error::expected $EXPECTED_PACKAGES publishable package manifests, matched ${#pkgs[@]} — refusing to release"
            exit 1
          fi
          dest="$RUNNER_TEMP/release-tarballs"
          mkdir -p "$dest"
          for pkg in "${pkgs[@]}"; do
            (cd "$(dirname "$pkg")" && pnpm pack --pack-destination "$dest")
          done
          packed=("$dest"/*.tgz)
          if [ "${#packed[@]}" -ne "${#pkgs[@]}" ]; then
            echo "::error::packed ${#packed[@]} tarballs from ${#pkgs[@]} packages"
            exit 1
          fi

      # Scan what actually ships. The tracked-file and history modes cannot see `dist/` (gitignored), which is
      # most of the published bytes and carries every `src` comment through the sourcemaps' `sourcesContent`.
      # See scripts/leak-scan-tarballs.cjs. `--from` scans the tarballs packed above, the very files that are
      # uploaded and published, and fails if one is missing or extra. Runs on dry-runs too — a dry run whose
      # whole job is to prove the pipeline should exercise the gates, not skip them.
      - name: Leak-scan the packed tarballs
        env:
          # Optional. Set the repo secret to check the employer-name class of needle too; with it the scan runs
          # in the strict SNAPSHOT mode, without it the HARD class (credentials, keys, real addresses, absolute
          # local paths) still fails the build. The script prints which mode it chose, so the weaker mode can
          # never be mistaken for the stronger one.
          LEAK_SCAN_EXTRA: ${{ secrets.LEAK_SCAN_EXTRA }}
        run: node scripts/leak-scan-tarballs.cjs --from "$RUNNER_TEMP/release-tarballs"

      # The sums are written after the scan, over the scanned files. `publish` checks them before it does
      # anything else: they catch a file that changed or went missing between the two jobs (a damaged or
      # replaced artifact), which is all a checksum stored beside the files can prove.
      - name: Record the tarball checksums
        run: |
          cd "$RUNNER_TEMP/release-tarballs"
          sha256sum -- *.tgz > SHA256SUMS
          # The approver reads this on the run's summary page: what `publish` will upload, by name and sum.
          {
            echo '### Tarballs that `publish` will upload'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Short retention: the artifact only has to outlive the reviewer's approval. If it has expired by then, the
      # download fails and the release is re-run, which re-verifies; nothing publishes from a stale build.
      # `overwrite: true` so "Re-run all jobs" replaces the artifact (and its sums) instead of failing on the name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release-tarballs
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish (tokenless, provenance)
    needs: verify
    runs-on: ubuntu-latest # provenance needs a GitHub-hosted runner's OIDC identity — never a self-hosted one
    # 360 — GitHub's default, but set EXPLICITLY so it reads as a decision rather than an omission.
    #
    # This job's actual execution is a minute or two. The bound is long because the job waits on the `release`
    # environment's required reviewer first, and an approval can take well over an hour. Whether
    # `timeout-minutes` consumes that waiting window is not something the docs state plainly and not something
    # we have tested, so the safe reading is that it might.
    #
    # The asymmetry settles it. Too long costs idle runner minutes on a job that hangs. Too short kills a
    # release mid-publish, leaving some of the family on npm and the rest not — immutable, not
    # unpublishable back out, and the exact catastrophe the rest of this file is built to avoid. No finite
    # bound is provably safe if the wait counts (a reviewer can take a day), so this one is deliberately not
    # a tight fit. If the waiting window turns out NOT to count, this is simply generous, which is fine.
    timeout-minutes: 360
    environment: release # manual-approval gate (required reviewer on the environment)
    # The only job that can mint the OIDC token. It runs no code from the repo's dependency tree: no checkout,
    # no install, no repo script. Everything it executes is the runner's own tools, the pinned actions below, one
    # exact npm, and the inline shell in this file.
    permissions:
      id-token: write
      contents: read
    steps:
      # The tarballs `verify` packed and scanned, and their checksums. Pinned to the commit of the upstream v8.0.2 tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release-tarballs

      # Before anything else touches the files: every tarball matches its recorded sum, and the directory holds
      # nothing but those tarballs and the sums file (an extra .tgz would be published unchecked).
      - name: Check the tarball checksums
        run: |
          cd "$RUNNER_TEMP/release-tarballs"
          sha256sum --check --strict SHA256SUMS
          listed="$(sed 's/^[0-9a-f]*  //' SHA256SUMS | sort)"
          present="$(ls -A | grep -vx 'SHA256SUMS' | sort)"
          if [ -z "$listed" ] || [ "$listed" != "$present" ]; then
            echo "::error::the artifact is not exactly the tarballs listed in SHA256SUMS. Listed: $listed. Present: $present"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the runner's bundled npm is older.
      #
      # An EXACT version, because this is the one job that holds the publish identity and the npm that runs in it
      # is code with that identity. A range such as `^11.5.1` resolves at run time to
      # whatever npm 11 shipped that morning: nothing in our diff would say which npm published, and a bad or
      # hostile release would run with the token on the next tag. So a new npm is a deliberate, reviewed edit of
      # this one line. Dependabot does not bump it (the version sits in a shell string, not a manifest): to bump it,
      # read the version the last release published with from the registry (`npm view @cloudbitmaps/core@<version>
      # _npmVersion`), pick the new one from `npm view npm versions`, check its changelog, and edit this line in
      # a pull request (RELEASING.md, "Bumping npm").
      - name: Install the exact npm for Trusted Publishing
        run: npm install -g npm@11.21.1

      # Read the tarballs themselves, since they are what will be published: the set is exactly
      # EXPECTED_PACKAGES, one per name, every package at one version (the tag's, on a tag ref), none private.
      # Writes `name<TAB>version<TAB>file` lines in dependency order (a package after every family package it
      # depends on, so `core` lands before the packages that need it) for the steps below to read. Node's own
      # modules and `tar` only: no repo code runs here.
      - name: Check the tarball set and work out the publish order
        run: |
          : "${EXPECTED_PACKAGES:?EXPECTED_PACKAGES must be set at the workflow level}"
          node - <<'EOF'
          const { execFileSync } = require('node:child_process');
          const { readdirSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const dir = join(process.env.RUNNER_TEMP, 'release-tarballs');
          const expected = Number(process.env.EXPECTED_PACKAGES);
          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          if (!Number.isInteger(expected) || expected < 1) fail('EXPECTED_PACKAGES is not a count');
          const files = readdirSync(dir).filter((f) => f.endsWith('.tgz')).sort();
          if (files.length !== expected) {
            fail(`expected ${expected} tarballs, the artifact has ${files.length}: ${files.join(', ')}`);
          }
          const pkgs = files.map((file) => {
            const manifest = JSON.parse(
              execFileSync('tar', ['-xzOf', join(dir, file), 'package/package.json'], {
                encoding: 'utf8',
              }),
            );
            return { file, name: manifest.name, version: manifest.version, manifest };
          });
          const names = new Set(pkgs.map((p) => p.name));
          if (names.size !== pkgs.length) fail('two tarballs carry the same package name');
          for (const p of pkgs) {
            if (!p.name || !p.version) fail(`${p.file} has no name or version`);
            if (p.manifest.private === true) fail(`${p.name} is private: it cannot be published`);
          }
          const versions = new Set(pkgs.map((p) => p.version));
          if (versions.size !== 1) fail(`the tarballs are at more than one version: ${[...versions].join(', ')}`);
          const ref = process.env.GITHUB_REF ?? '';
          if (ref.startsWith('refs/tags/v')) {
            const tag = (process.env.GITHUB_REF_NAME ?? '').replace(/^v/, '');
            if (!versions.has(tag)) fail(`tag v${tag} does not match the tarballs' version ${[...versions][0]}`);
          }
          const familyDeps = (p) =>
            ['dependencies', 'peerDependencies', 'optionalDependencies']
              .flatMap((field) => Object.keys(p.manifest[field] ?? {}))
              .filter((dep) => names.has(dep));
          const ordered = [];
          const done = new Set();
          let rest = pkgs;
          while (rest.length > 0) {
            const ready = rest.filter((p) => familyDeps(p).every((dep) => done.has(dep)));
            if (ready.length === 0) fail('the packages depend on each other in a cycle');
            for (const p of ready) {
              ordered.push(p);
              done.add(p.name);
            }
            rest = rest.filter((p) => !done.has(p.name));
          }
          writeFileSync(
            join(process.env.RUNNER_TEMP, 'publish-order.tsv'),
            ordered.map((p) => `${p.name}\t${p.version}\t${p.file}\n`).join(''),
          );
          console.log(ordered.map((p) => `${p.name}@${p.version}`).join('\n'));
          EOF

      # Two things npm will not tell you until it is too late, both of which produce a PARTIAL release of a
      # family that ships in lockstep — the one npm state that cannot be undone.
      #
      #   1. A NAME THAT DOES NOT EXIST YET. This pipeline is tokenless: it authenticates by OIDC against a
      #      Trusted Publisher, which is a per-package npm setting that cannot be bound to a package that has
      #      never been published. Publishing walks the packages in dependency order and stops at the first
      #      failure, so a family where `core` is published and a new driver package is not would put
      #      `core@X.Y.Z`, and any package reached before the new one, on the registry, immutably, and
      #      then fail — leaving part of the family published. Create the name first
      #      (`pnpm release:bootstrap`), bind its Trusted Publisher, then tag.
      #
      #   2. A VERSION THAT IS ALREADY THERE. A re-run, or a tag cut against a version some package was
      #      hand-published at, would publish some packages and be rejected on the others.
      #      Refusing it here, before the first publish, leaves nothing half done.
      #
      # Both are read-only probes of the registry, so they cost seconds and can only fail BEFORE anything
      # irreversible happens. `npm view` reads a replica that lags for minutes after a first publish, but by
      # release time these names are long-established, so a 404 here means the name genuinely is not there.
      - name: Refuse to publish an unbootstrapped name or a version already on the registry
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dryRun)
        run: |
          fail=0
          # File descriptor 3, so `npm view` cannot read the loop's input.
          while IFS=$'\t' read -r NAME VER FILE <&3; do
            # Both probes must fail CLOSED. `npm view` exits non-zero for a missing name AND for a 5xx, a
            # rate limit or a timeout, so a VERSION probe that reads any failure as "this version is not
            # published" lets a transient one through. Classify on the error text and refuse anything that is
            # not a clean 404.
            # `x="$(cmd)"; rc=$?` does NOT work under `set -e` (the Actions default shell): the failing
            # substitution aborts the step before `$?` is ever read, so the guard fails closed but SILENTLY,
            # with no ::error:: line to tell the operator which package or why. `|| rc=$?` keeps the command
            # in a list, where `set -e` is suppressed.
            probe_rc=0
            probe_err="$(npm view "$NAME" version 2>&1 >/dev/null)" || probe_rc=$?
            if [ "$probe_rc" -ne 0 ] && ! printf '%s' "$probe_err" | grep -qiE 'code E404|404 Not Found|is not in th'; then
              echo "::error::could not reach the registry to check $NAME — refusing to release rather than guess. $probe_err"
              fail=1
            elif [ "$probe_rc" -ne 0 ]; then
              echo "::error::$NAME does not exist on the registry. A Trusted Publisher cannot be bound to a package that has never been published, so this tokenless workflow cannot create it — run \`pnpm release:bootstrap\` to create the name, bind its Trusted Publisher on npmjs.com, then re-tag. Releasing now would publish the packages that DO exist and fail on this one, leaving a partial, immutable release."
              fail=1
            else
              ver_rc=0
              ver_err="$(npm view "$NAME@$VER" version 2>&1 >/dev/null)" || ver_rc=$?
              if [ "$ver_rc" -eq 0 ]; then
                echo "::error::$NAME@$VER is already on the registry. Publishing would be rejected for it, after the packages before it had gone out. Bump the version."
                fail=1
              elif ! printf '%s' "$ver_err" | grep -qiE 'code E404|404 Not Found|is not in th'; then
                echo "::error::could not reach the registry to check $NAME@$VER — refusing to release rather than guess. $ver_err"
                fail=1
              fi
            fi
          done 3< "$RUNNER_TEMP/publish-order.tsv"
          [ "$fail" -eq 0 ] || exit 1

      # Dry-run on manual dispatch (default): validates only — mints no attestation, needs no auth token.
      # `publishConfig.access=public` lives in package.json. Provenance is opted into here, by `--provenance` and
      # NPM_CONFIG_PROVENANCE, and not in the manifests, where it would block the hand-run bootstrap publish
      # (see scripts/bootstrap-publish.cjs).
      # Each tarball is published by file, in the order worked out above (a package after the family packages it
      # depends on). The dependency versions in each tarball were fixed when it was packed.
      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dryRun
        run: |
          while IFS=$'\t' read -r NAME VER FILE <&3; do
            npm publish "$RUNNER_TEMP/release-tarballs/$FILE" --provenance --access public --dry-run
          done 3< "$RUNNER_TEMP/publish-order.tsv"
        env:
          NPM_CONFIG_PROVENANCE: true
      # Real, provenance-signed publish — ONLY from a vX.Y.Z tag ref: a pushed tag, or a dispatch on a tag
      # with dryRun=false. A dispatch on a tag with dryRun still true can NOT publish for real (that would
      # break the dry-run-default safety contract), and a dispatch on a branch with dryRun=false never gets
      # here: the first step of `verify` fails it. Every real publish has passed the tag↔version guards above.
      - name: Publish (real)
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dryRun)
        run: |
          while IFS=$'\t' read -r NAME VER FILE <&3; do
            npm publish "$RUNNER_TEMP/release-tarballs/$FILE" --provenance --access public
          done 3< "$RUNNER_TEMP/publish-order.tsv"
        env:
          # No NODE_AUTH_TOKEN. npm authenticates from this workflow's OIDC identity (Trusted Publishing);
          # adding a token here would introduce a long-lived secret AND be rejected outright by the packages'
          # "require 2FA and disallow tokens" setting.
          NPM_CONFIG_PROVENANCE: true

  # Cut the GitHub Release from the same tag, with notes lifted verbatim from CHANGELOG.md.
  #
  # A SEPARATE job, deliberately. Creating a release needs `contents: write`, and SECURITY.md's hardening
  # checklist promises the publish job "carries only the OIDC `id-token` permission" — so the write scope lives
  # here, on a job that cannot publish, instead of being added to the job that can. (Letting `changesets/action`
  # do this inside the publish job, with `contents: write`, is simpler, and it widens the blast radius of the one
  # job an attacker would most want to influence.)
  #
  # `needs: publish` + the tag condition mean a release object only ever appears for a version that really
  # published. Nothing here is approval-gated a second time: the human already approved the publish, and this
  # job cannot ship code.
  github-release:
    name: github release (notes from CHANGELOG)
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release object; NOT granted to the publish job above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Fails loudly on a missing or empty section rather than publishing blank notes — see
      # scripts/changelog-section.cjs and its tests.
      - name: Extract the release notes
        run: node scripts/changelog-section.cjs "${GITHUB_REF_NAME}" > /tmp/notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
