# Keep dependencies current — monthly + grouped (weekly is too noisy) with a short cooldown so brand-new
# releases settle before we pick them up. Monthly + grouped, per our dependency-bot baseline.
#
# MAJORS ARE NEVER GROUPED. A grouped PR is meant to be a routine, low-attention merge; bundling a
# major-version jump into one turns "bump the github-actions group with 2 updates" into an
# actions/upload-artifact v4 -> v7 upgrade wearing a chore label. Minor+patch batch into a single monthly PR;
# each major arrives on its own, so the title names the risk and the diff is the only thing you review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # `fuzz/` is a SEPARATE install: `pnpm-workspace.yaml` lists only `packages/*`, so `fuzz/pnpm-lock.yaml` is
  # outside the root graph and the entry above (directory: /) never saw it. `@jazzer.js/core` was therefore
  # never bumped by anything, in the one corner of the repo whose whole job is finding memory-safety bugs.
  - package-ecosystem: npm
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      fuzz-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # `/` reads .github/workflows and a root action.yml, and nothing below .github/actions, where the composite actions
  # pin actions too: those directories are named, and globbed so a new one is covered the day it lands. A group
  # spans directories, so a minor or patch bump anywhere is still this one monthly pull request. A major is grouped
  # by name alone, so it still arrives on its own, but in one pull request for every directory that pins that action:
  # split by directory, the restore and save actions could be merged a major apart.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      github-actions-major:
        group-by: dependency-name
        update-types:
          - major
